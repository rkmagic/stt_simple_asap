# Render Blueprint: https://render.com/docs/blueprint-spec
# Connect this repo in the Render dashboard or use `render blueprint apply`.

services:
  - type: web
    name: node-transcriber
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: MIN_RELEASE_AGE_DAYS
        value: "3"
      - key: OPENAI_API_KEY
        sync: false
      - key: API_KEY
        sync: false
